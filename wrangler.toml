name = "dema-agency"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# Le site est construit avant chaque déploiement
[build]
command = "npm run build"

# Site React (dossier dist) ; l'API passe d'abord par le Worker
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dema-agency-eu"
database_id = "0669373a-5e64-49e0-a64a-ce9124511a74"
migrations_dir = "migrations"

# Notifications push : 8h et 18h (heure de Paris en hiver) + rappels de rendez-vous toutes les 15 min
[triggers]
crons = ["0 7 * * *", "0 17 * * *", "*/15 * * * *"]

[observability]
enabled = true
