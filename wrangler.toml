name = "agence-dema"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# Le site est construit avant chaque déploiement
[build]
command = "npm run build"

# Site React (dossier dist) ; l'API passe d'abord par le Worker
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dema-agency"
database_id = "5b49ab74-e4ff-4d38-b944-35cce39c9727"
migrations_dir = "migrations"

[observability]
enabled = true
